<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ascend — Web Builder</title><link rel="stylesheet" href="ascend.css"></head><body><div id="app"><header class="topbar"><div class="brand"><b>DEWIFY</b><span>→</span><strong>Ascend</strong><small>Web Builder</small></div><input id="projectName" value="Untitled website"><div class="top-actions"><button id="undo">↶</button><button id="redo">↷</button><button data-device="desktop" class="device active">Desktop</button><button data-device="tablet" class="device">Tablet</button><button data-device="mobile" class="device">Mobile</button><button id="preview">Preview</button><button id="save" class="accent">Save</button><button id="publish" class="accent">Publish</button><button id="export" class="accent">Export</button></div></header><div class="workspace"><aside class="left-panel"><div class="tabs"><button class="tab active" data-tab="templates">Templates</button><button class="tab" data-tab="sections">Sections</button><button class="tab" data-tab="elements">Elements</button></div><div id="library"></div><div class="left-footer"><button id="blank">＋ Blank website</button><label>＋ Upload image<input id="imageUpload" type="file" accept="image/*" hidden></label></div></aside><main class="canvas-area"><div class="canvas-toolbar"><span>Editing</span><span id="saveStatus">Saved locally</span></div><div id="canvasShell" class="canvas-shell desktop"><div id="canvas"></div></div></main><aside class="right-panel"><div class="selection-head"><span id="selectionType">Page</span><button id="clearSelection">×</button></div><div id="inspector"></div></aside></div></div><div id="toast"></div><div id="previewModal" class="modal hidden"><div class="modal-head"><b>Preview</b><button id="closePreview">Close</button></div><iframe id="previewFrame"></iframe></div><script src="ascend.js"></script><script src="ascend-upload.js"></script><script>document.getElementById('publish').onclick=()=>{localStorage.setItem('ascend-published','true');document.getElementById('preview').click();setTimeout(()=>alert('Publish foundation ready: your current project is saved locally and opened as the publish preview. Connect cloud hosting/domain storage in the next phase.'),50)}</script></body></html>
